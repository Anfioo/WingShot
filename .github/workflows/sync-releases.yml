name: Sync Release To Mirrors

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag; empty means the latest published release"
        required: false
        type: string
        default: ""
      gitee:
        description: "Sync to Gitee"
        required: true
        type: boolean
        default: true
      gitea:
        description: "Sync to self-hosted Gitea"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-release-to-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REQUESTED_TAG: ${{ inputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --exclude-drafts \
              --exclude-pre-releases \
              --json tagName \
              --jq '.[0].tagName')"
          fi

          if [[ -z "$tag" ]]; then
            echo "No published GitHub Release was found" >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > release.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download Release Assets
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets
          mkdir -p assets
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir assets \
            --pattern "*" \
            --clobber

      - name: Sync To Gitee & Gitea (parallel)
        if: inputs.gitee || inputs.gitea
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          if [[ "${{ inputs.gitee }}" == "true" ]]; then
            PLATFORM=gitee \
            PLATFORM_TOKEN="${{ secrets.GITEE_TOKEN }}" \
            TAG_NAME="${{ steps.release.outputs.tag }}" \
            ASSETS_DIR=assets \
            bash .github/scripts/sync-release.sh &
            pids+=("$!")
          fi
          if [[ "${{ inputs.gitea }}" == "true" ]]; then
            PLATFORM=gitea \
            PLATFORM_TOKEN="${{ secrets.GITEA_TOKEN }}" \
            TAG_NAME="${{ steps.release.outputs.tag }}" \
            ASSETS_DIR=assets \
            bash .github/scripts/sync-release.sh &
            pids+=("$!")
          fi
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          exit "$failed"
