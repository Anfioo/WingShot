name: Snow Shot Static Release

on:
  push:
    tags:
      - "v*_snow-shot"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，必须与 CMakeLists.txt 中的 SNOW_SHOT_VERSION 一致，例如 1.1.2-beta"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: snow-shot-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and draft Snow Shot release
    runs-on: windows-2025-vs2026
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'set\(SNOW_SHOT_VERSION "([^"]+)"\)').Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $requested = ($env:INPUT_VERSION).Trim()
            if ($requested -cne $version) {
              throw "输入的版本 $requested 与 CMakeLists.txt 中的 SNOW_SHOT_VERSION ($version) 不一致。"
            }
            $tag = "v${version}_snow-shot"
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Select MSVC x64 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.51
          vsversion: 18.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install Python build helper
        shell: pwsh
        run: python -m pip install --disable-pip-version-check virtualenv

      - name: Install NSIS
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "NSIS compiler is already available."
            exit 0
          }
          choco install nsis --no-progress --yes
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            throw "Failed to install NSIS (choco exit code $LASTEXITCODE)."
          }
          # package-snow-shot.ps1 只认 PATH、%ProgramFiles(x86)%\NSIS 和 %ProgramFiles%\NSIS，
          # 这里按同样位置校验，避免安装成功但打包时仍找不到。
          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $makensis) {
            throw "NSIS installation finished but makensis.exe was not found in the expected locations."
          }
          Write-Host "NSIS compiler: $makensis"

      - name: Export GitHub Actions cache service
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            snow-crates -> ../build/snow-shot-msvc-release/cargo
            snow_draw_engine_qt -> ../build/snow-shot-msvc-release/cargo
            snow_rust_ffi -> ../build/snow-shot-msvc-release/cargo
          cache-on-failure: true

      - name: Install static project dependencies
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -VcpkgVariants Static -SkipQtValidation

      - name: Cache static Qt kit
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\snow-qt\6.11.1\msvc2026_64-static-system-codecs
          key: snow-qt-static-system-codecs-v2-6.11.1-msvc2026-x64-${{ runner.os }}-${{ hashFiles('scripts/build-static-qt.ps1', 'scripts/bootstrap.ps1', 'vcpkg.json', 'cmake/vcpkg-overlay-triplets/x64-windows-static.cmake', 'cmake/vcpkg-overlay-ports/zlib/**') }}

      - name: Prepare Qt 6.11.1 static kit
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TOOL_CACHE "snow-qt\6.11.1\msvc2026_64-static-system-codecs"
          $dependencies = Join-Path $env:GITHUB_WORKSPACE ".tools\vcpkg\installed\static\x64-windows-static"
          & "$env:GITHUB_WORKSPACE\scripts\build-static-qt.ps1" -QtVersion 6.11.1 -InstallPrefix $prefix -DependencyPrefix $dependencies
          if ($LASTEXITCODE -ne 0) { throw "Static Qt bootstrap failed." }
          $qtDir = Join-Path $prefix "lib\cmake\Qt6"
          if (-not (Test-Path -LiteralPath (Join-Path $qtDir "Qt6Config.cmake") -PathType Leaf)) {
            throw "Qt 6.11.1 static CMake package was not found at $qtDir"
          }
          "SNOW_QT_STATIC_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, audit, and package statically
        shell: pwsh
        run: .\scripts\stage-snow-shot-release.ps1

      - name: Verify focused updater and installer behavior
        shell: pwsh
        run: |
          python scripts/test-snow-shot-publisher.py
          if ($LASTEXITCODE -ne 0) { throw "Publisher tests failed." }
          & scripts/test-snow-shot-ocr-release-runtime.ps1
          & scripts/test-snow-shot-release-symbols.ps1 -ReleaseHelperPath build/snow-shot-msvc-release/snow_shot/Release/snow-shot-updater.exe
          & scripts/test-snow-shot-installer.ps1
          & scripts/test-snow-shot-installer-i18n.ps1
          . scripts/snow-build-environment.ps1
          $null = Set-SnowBuildEnvironment -Preset 'snow-shot-msvc-release'
          cmake --preset snow-shot-msvc-release -DSNOW_SHOT_BUILD_UPDATE_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "Updater test configuration failed." }
          cmake --build --preset build-snow-shot-msvc-release --target snow-shot-update-adapter-tests snow-shot-update-about-tests snow-shot-update-settings-tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Updater test build failed." }
          ctest --test-dir build/snow-shot-msvc-release/snow_shot -C Release -R '^snow-shot-update-(adapter-tests|about-tests|settings-tests)$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Updater tests failed." }
          & scripts/test-snow-shot-update-helper.ps1

      - name: Verify tag and locate package
        id: package
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'set\(SNOW_SHOT_VERSION "([^"]+)"\)').Groups[1].Value
          if ($env:RELEASE_TAG -cne "v${version}_snow-shot") {
            throw "Unexpected release tag: $env:RELEASE_TAG"
          }
          $names = @()
          foreach ($variant in @('online', 'offline')) {
            $base = "snow-shot-$version-windows-x64-$variant"
            $names += @("$base.exe", "$base.exe.sha256", "$base.manifest.json",
              "$base-update.zip", "$base-update.zip.sha256", "$base-update.manifest.json")
          }
          $base = "snow-shot-$version-windows-x64-portable"
          $names += @("$base.zip", "$base.zip.sha256", "$base.manifest.json")
          $runtime = (Get-Content -Raw snow_shot/packaging/snow-shot-ocr-asset-manifest.json | ConvertFrom-Json).runtime.version
          $base = "snow-ocr-runtime-$runtime-windows-x64"
          $names += @("$base.zip", "$base.zip.sha256", "$base.manifest.json")
          $packages = @($names | ForEach-Object { Get-Item -LiteralPath "build/snow-shot-msvc-release/$_" -ErrorAction Stop })
          # 用单行分号拼接，不要用多行输出：多行值经 workflow output 往返后行尾会带 CR，
          # 拆出来的路径会残留尾随 CR，而 gh 会对每个文件参数做 filepath.Glob
          # （pkg/cmdutil/args.go 的 GlobPaths），带 CR 的路径匹配不到任何文件并直接报错。
          $assets = ($packages | ForEach-Object { $_.FullName }) -join ';'
          "assets=$assets" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Preserve matching release symbols separately
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-symbols-${{ steps.release_tag.outputs.tag }}
          path: |
            build/snow-shot-msvc-release/snow-shot-symbols-windows-x64.zip
            build/snow-shot-msvc-release/snow-shot-symbols-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Create draft prerelease with generated changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("${{ steps.package.outputs.assets }}" -split ';' | Where-Object { $_ })
          if (-not $assets) { throw "No release assets were resolved by the package step." }
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'set\(SNOW_SHOT_VERSION "([^"]+)"\)').Groups[1].Value
          $releaseFlags = @()
          if (($version -split '\+')[0].Contains('-')) { $releaseFlags += '--prerelease' }
          # 手动触发时标签尚不存在，显式指向本次运行的提交，避免 gh 把标签打到默认分支上。
          $targetFlags = @()
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $targetFlags += @('--target', $env:GITHUB_SHA) }
          gh release create $env:RELEASE_TAG @assets `
            --draft `
            @releaseFlags `
            @targetFlags `
            --generate-notes `
            --title "Snow Shot $env:RELEASE_TAG"
